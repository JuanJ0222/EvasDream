<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eva's Dream — Negocio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #F6F0EC; --bg-alt: #FBF7F4; --card: #FFFDFB;
    --ink: #3A2C35; --ink-soft: #8A7680; --ink-faint: #B8A8AF;
    --primary: #C4707A; --primary-dark: #A85560;
    --line: #E6D8D2; --line-strong: #D8C4BD;
    --cat-pantuflas: #C4707A; --cat-pantuflas-bg: #FBEEEF;
    --cat-botas: #B5714A; --cat-botas-bg: #F6ECE3;
    --cat-pijamas: #8E76B3; --cat-pijamas-bg: #F1ECF7;
    --cat-peluches: #C99A3D; --cat-peluches-bg: #FAF1DE;
    --cat-accesorios: #6E9B78; --cat-accesorios-bg: #EBF3EC;
    --ok: #6E9B78; --warn: #C99A3D; --danger: #B5555F;
    --radius: 18px;
    --shadow: 0 2px 10px rgba(58,44,53,0.06), 0 10px 30px rgba(58,44,53,0.05);
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg: #241B22; --bg-alt: #2B2029; --card: #322530;
    --ink: #F3E9EC; --ink-soft: #C4AEB8; --ink-faint: #8B7480;
    --primary: #E08D96; --primary-dark: #C4707A;
    --line: #43323E; --line-strong: #55404C;
    --cat-pantuflas: #E08D96; --cat-pantuflas-bg: #3E2A30;
    --cat-botas: #D19566; --cat-botas-bg: #3C2E24;
    --cat-pijamas: #B29AD1; --cat-pijamas-bg: #332A40;
    --cat-peluches: #E3BD68; --cat-peluches-bg: #3B3020;
    --cat-accesorios: #93C29D; --cat-accesorios-bg: #223228;
    --shadow: 0 2px 10px rgba(0,0,0,0.25), 0 10px 30px rgba(0,0,0,0.25);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 1px 1px, rgba(58,44,53,0.05) 1px, transparent 0) 0 0/22px 22px, var(--bg);
    color:var(--ink); font-family:'Poppins', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
    transition: background .2s ease, color .2s ease;
  }
  [data-theme="dark"] body{ background: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0) 0 0/22px 22px, var(--bg); }
  h1,h2,h3,.display{font-family:'Fraunces', serif;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
  .wrap{max-width:1180px; margin:0 auto; padding:28px 22px 90px;}

  /* LOGIN */
  .login-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{background:var(--card); border:1.5px dashed var(--line-strong); border-radius:22px; padding:36px 32px 30px; width:100%; max-width:380px; box-shadow:var(--shadow); text-align:center;}
  .logo-img{width:84px; height:84px; border-radius:50%; margin:0 auto 14px; object-fit:cover; box-shadow:var(--shadow); background:#fff; display:block;}
  .login-card h1{font-size:24px; margin:0 0 4px;}
  .login-card p{color:var(--ink-soft); font-size:13.5px; margin:0 0 22px;}
  .field{margin-bottom:14px; text-align:left;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line-strong); background:var(--card); font-family:'Poppins'; font-size:14px; color:var(--ink);}
  .login-card input{background:var(--bg-alt);}
  .login-error{color:var(--danger); font-size:13px; margin:-4px 0 14px; min-height:16px;}

  /* HEADER */
  header.top{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:18px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .logo-img{width:50px; height:50px; margin:0;}
  .brand h1{font-size:27px; margin:0; font-weight:600; letter-spacing:-0.01em;}
  .brand p{margin:2px 0 0; color:var(--ink-soft); font-size:12.5px;}
  .rolebadge{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 9px; border-radius:999px; background:var(--cat-pijamas-bg); color:var(--cat-pijamas); margin-left:6px;}
  .headerbtns{display:flex; gap:8px; align-items:center;}
  .theme-toggle{width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--card); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px;}
  .theme-toggle:hover{background:var(--bg-alt);}

  .btn{border:none; cursor:pointer; font-family:'Poppins',sans-serif; font-weight:600; border-radius:999px; padding:11px 20px; font-size:14px; display:inline-flex; align-items:center; gap:7px; transition: transform .15s ease, box-shadow .15s ease;}
  .btn:disabled{opacity:.55; cursor:default;}
  .btn:focus-visible, input:focus-visible, select:focus-visible, .chip:focus-visible, .icon-btn:focus-visible, .tab:focus-visible{outline:2.5px solid var(--primary-dark); outline-offset:2px;}
  .btn-primary{background:var(--primary); color:#fff; box-shadow: 0 6px 16px rgba(196,112,122,0.35);}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line-strong);}
  .btn-ghost:hover{background:var(--card);}
  .btn-sm{padding:8px 15px; font-size:13px;}
  .btn-block{width:100%; justify-content:center;}

  /* TABS */
  .tabs{display:flex; gap:4px; margin-bottom:22px; border-bottom:1.5px solid var(--line); overflow-x:auto;}
  .tab{background:none; border:none; cursor:pointer; font-family:'Poppins'; font-weight:600; font-size:14px; color:var(--ink-soft); padding:10px 4px; margin-right:20px; position:relative; white-space:nowrap;}
  .tab.active{color:var(--ink);}
  .tab.active::after{content:''; position:absolute; left:0; right:0; bottom:-1.5px; height:2.5px; background:var(--primary); border-radius:2px;}

  /* STATS */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
  .stat{background:var(--card); border-radius:16px; padding:14px 16px; border:1px solid var(--line); box-shadow:var(--shadow);}
  .stat .num{font-family:'JetBrains Mono', monospace; font-size:22px; font-weight:600;}
  .stat .lbl{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .stat.warn .num{color:var(--warn);} .stat.ok .num{color:var(--ok);} .stat.bad .num{color:var(--danger);}

  /* CHIPS / TOOLS */
  .filterbar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{font-family:'Poppins'; font-size:13px; font-weight:600; cursor:pointer; padding:7px 15px 7px 13px; border-radius:999px; border:1.5px dashed var(--line-strong); background:var(--card); color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .chip .dot{width:8px; height:8px; border-radius:50%; background:var(--ink-faint);}
  .chip.active{border-style:solid; color:#fff;}
  .chip.warnchip{border-color:var(--warn); color:var(--warn);}
  .chip.warnchip.active{background:var(--warn); color:#fff;}
  .toolsrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
  .searchwrap{position:relative; flex:1; min-width:180px; max-width:260px;}
  .searchwrap input{width:100%; padding:9px 13px 9px 34px; border-radius:999px; border:1.5px solid var(--line); background:var(--card); font-family:'Poppins'; font-size:13.5px; color:var(--ink);}
  .searchwrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.5;}
  select.toolsel{padding:9px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--card); font-family:'Poppins'; font-size:13px; color:var(--ink); cursor:pointer;}

  /* PRODUCT GRID/CARDS */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px;}
  .card{position:relative; background:var(--card); border-radius:var(--radius); padding:0 16px 14px; box-shadow:var(--shadow); border:1.5px dashed var(--line-strong); display:flex; flex-direction:column; gap:9px; animation: pop .2s ease; overflow:hidden;}
  @keyframes pop{ from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:none;} }
  .card .thumb{width:calc(100% + 32px); margin:0 -16px; height:135px; background:var(--bg-alt); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .card .thumb img{width:100%; height:100%; object-fit:cover;}
  .card .thumb .noimg{font-size:24px; opacity:.35;}
  .card .body{position:relative; padding-top:12px; display:flex; flex-direction:column; gap:8px;}
  .card h3{margin:0; font-size:17px; font-weight:600; line-height:1.2;}
  .subtipo{color:var(--ink-soft); font-size:12.5px; margin-top:-6px;}
  .cat-pill{font-size:10.5px; font-weight:700; letter-spacing:.02em; padding:3px 9px; border-radius:999px; text-transform:uppercase;}
  .tagtop{display:flex; justify-content:flex-end;}
  .stockrow{display:flex; align-items:center; justify-content:space-between;}
  .stockcount .num{font-family:'JetBrains Mono'; font-size:21px; font-weight:600;}
  .stockcount .u{font-size:11px; color:var(--ink-soft);}
  .lowbadge{font-size:10px; font-weight:700; color:#fff; background:var(--warn); padding:3px 7px; border-radius:999px; text-transform:uppercase;}
  .stepper{display:flex; align-items:center; gap:6px;}
  .stepper button{width:26px; height:26px; border-radius:8px; border:1.5px solid var(--line-strong); background:var(--bg-alt); font-size:15px; cursor:pointer; font-weight:700; color:var(--ink);}
  .stepper button:disabled{opacity:.5;}
  .card .price{font-size:12px; color:var(--ink-soft); text-align:right;}
  .card .price b{color:var(--ink); font-family:'JetBrains Mono';}
  .card .margin{font-size:11px; color:var(--ok); font-family:'JetBrains Mono'; text-align:right;}
  .cardfoot{display:flex; gap:8px; margin-top:2px; border-top:1px dashed var(--line); padding-top:9px;}
  .icon-btn{flex:1; background:transparent; border:none; cursor:pointer; font-size:12px; font-weight:600; color:var(--ink-soft); padding:5px; border-radius:8px;}
  .icon-btn:hover{background:var(--bg-alt); color:var(--ink);}
  .icon-btn.danger{color:var(--danger);}

  .empty{text-align:center; padding:60px 20px; border:1.5px dashed var(--line-strong); border-radius:var(--radius); background:var(--card);}
  .empty h2{margin:12px 0 6px; font-size:20px;}
  .empty p{color:var(--ink-soft); font-size:14px; margin:0 0 18px;}

  /* VENDER (POS) */
  .pos-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start;}
  .pos-list{display:flex; flex-direction:column; gap:8px; max-height:560px; overflow-y:auto; padding-right:4px;}
  .pos-row{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px;}
  .pos-row .pthumb{width:40px; height:40px; border-radius:9px; background:var(--bg-alt); overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .pos-row .pthumb img{width:100%; height:100%; object-fit:cover;}
  .pos-row .pinfo{flex:1; min-width:0;}
  .pos-row .pname{font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pos-row .pmeta{font-size:11.5px; color:var(--ink-soft);}
  .pos-row .pprice{font-family:'JetBrains Mono'; font-size:13px; font-weight:600; white-space:nowrap;}
  .pos-add{width:32px; height:32px; border-radius:50%; border:none; background:var(--primary); color:#fff; font-size:17px; cursor:pointer; flex-shrink:0;}
  .pos-add:disabled{opacity:.4; cursor:default;}

  .cartpanel{background:var(--card); border:1.5px dashed var(--line-strong); border-radius:var(--radius); padding:18px; position:sticky; top:16px;}
  .cartpanel h3{margin:0 0 12px; font-size:16px;}
  .cart-item{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px dashed var(--line);}
  .cart-item .cname{flex:1; font-size:13px; font-weight:600;}
  .cart-item .csub{font-family:'JetBrains Mono'; font-size:12px; color:var(--ink-soft);}
  .cart-item .cx{background:none; border:none; color:var(--danger); cursor:pointer; font-size:15px; padding:2px 4px;}
  .cart-empty{text-align:center; color:var(--ink-faint); font-size:13px; padding:24px 0;}
  .cart-total{display:flex; justify-content:space-between; align-items:baseline; margin:14px 0; font-size:15px; font-weight:600;}
  .cart-total b{font-family:'JetBrains Mono'; font-size:22px; color:var(--primary-dark);}

  /* APARTADOS */
  .apcard{background:var(--card); border:1.5px dashed var(--line-strong); border-radius:16px; padding:16px 18px; margin-bottom:12px;}
  .apcard .aphead{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .apcard h3{margin:0; font-size:16px;}
  .apcard .apmeta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .estado-badge{font-size:10.5px; font-weight:700; text-transform:uppercase; padding:3px 9px; border-radius:999px;}
  .estado-activo{background:var(--cat-peluches-bg); color:var(--cat-peluches);}
  .estado-completado{background:var(--cat-accesorios-bg); color:var(--cat-accesorios);}
  .estado-cancelado{background:var(--line); color:var(--ink-soft);}
  .progress-bar{background:var(--bg-alt); border-radius:999px; height:9px; overflow:hidden; margin:10px 0 6px;}
  .progress-fill{background:var(--ok); height:100%; border-radius:999px; transition:width .3s ease;}
  .apnums{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); font-family:'JetBrains Mono';}
  .apfoot{display:flex; gap:8px; margin-top:12px;}

  /* GASTOS */
  .gasto-row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:8px;}
  .gasto-row .gconcepto{flex:1; font-weight:600; font-size:14px;}
  .gasto-row .gcat{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.02em;}
  .gasto-row .gmonto{font-family:'JetBrains Mono'; font-weight:600; color:var(--danger);}

  /* PANELS/CHARTS */
  .panelgrid{display:grid; grid-template-columns:1.1fr 1fr; gap:16px; margin-bottom:16px;}
  .panel{background:var(--card); border:1.5px dashed var(--line-strong); border-radius:var(--radius); padding:18px 18px 8px; box-shadow:var(--shadow);}
  .panel h3{margin:0 0 4px; font-size:15px;}
  .panel .panelsub{color:var(--ink-soft); font-size:12px; margin-bottom:10px;}
  .panel canvas{max-height:220px;}
  .toplist{list-style:none; margin:0; padding:0;}
  .toplist li{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .toplist li:last-child{border-bottom:none;}
  .toplist .tname{font-weight:600;}
  .toplist .tcat{font-size:10.5px; color:var(--ink-soft);}
  .toplist .tval{font-family:'JetBrains Mono'; font-weight:600; color:var(--ok);}
  .period-tabs{display:flex; gap:6px; margin-bottom:18px;}
  .period-tab{font-family:'Poppins'; font-weight:600; font-size:12.5px; padding:7px 14px; border-radius:999px; border:1.5px solid var(--line-strong); background:var(--card); color:var(--ink-soft); cursor:pointer;}
  .period-tab.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  /* VENTAS HISTORY */
  .venta-row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 15px; margin-bottom:7px;}
  .venta-row .vinfo{flex:1; font-size:12.5px; color:var(--ink-soft);}
  .venta-row .vtotal{font-family:'JetBrains Mono'; font-weight:700;}
  .metodo-chip{font-size:10px; text-transform:uppercase; font-weight:700; background:var(--bg-alt); padding:2px 8px; border-radius:999px; color:var(--ink-soft);}

  /* MODAL */
  .overlay{position:fixed; inset:0; background:rgba(20,14,18,0.45); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal{background:var(--bg-alt); border-radius:22px; padding:26px 24px 22px; width:100%; max-width:440px; box-shadow:0 30px 60px rgba(0,0,0,0.35); border:1.5px solid var(--line); max-height:88vh; overflow-y:auto;}
  .modal h2{margin:0 0 4px; font-size:20px;}
  .modal .sub{color:var(--ink-soft); font-size:12.5px; margin-bottom:16px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions .btn{flex:1; justify-content:center;}
  .imgpreview{width:100%; height:120px; border-radius:12px; background:var(--card); border:1.5px dashed var(--line-strong); display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:10px; color:var(--ink-faint); font-size:13px;}
  .imgpreview img{width:100%; height:100%; object-fit:cover;}
  .gananciaPreview{font-size:12px; color:var(--ink-soft); margin:-6px 0 14px;}
  .gananciaPreview b{color:var(--ok); font-family:'JetBrains Mono';}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 19px; border-radius:999px; font-size:13px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,0.25); z-index:80;}
  .loading{display:flex; align-items:center; justify-content:center; min-height:60vh; color:var(--ink-soft); font-size:14px;}

  @media (max-width:900px){ .pos-grid{grid-template-columns:1fr;} .cartpanel{position:static;} .panelgrid{grid-template-columns:1fr;} }
  @media (max-width:640px){ .stats{grid-template-columns:repeat(2,1fr);} .field-row{grid-template-columns:1fr;} }
</style>
</head>

<script type="module">

function esc(str){ const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }
function catMeta(catId){ return CATS.find(c=>c.id===catId) || CATS[0]; }
function subtiposFor(catId){
  const pool = catId && catId !== 'Todas' ? products.filter(p=>p.categoria===catId) : products;
  const s = new Set(); pool.forEach(p=>{ if(p.subtipo) s.add(p.subtipo); });
  return Array.from(s).sort();
}
function money(n){ return '$' + Number(n||0).toLocaleString('es-CO', {maximumFractionDigits:0}); }
function isOwner(){ return role === 'owner'; }
function showToast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 2200);
}

/* ---------------- THEME ---------------- */
function applyTheme(t){ theme = t; document.documentElement.setAttribute('data-theme', t); }
function toggleTheme(){
  const next = theme === 'dark' ? 'light' : 'dark';
  applyTheme(next); render();
  if(session){ supabase.auth.updateUser({ data: { theme: next } }).catch(()=>{}); }
}

/* ---------------- AUTH ---------------- */
async function initAuth(){
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
  const { data } = await supabase.auth.getSession();
  session = data.session;
  if(session && session.user.user_metadata && session.user.user_metadata.theme) applyTheme(session.user.user_metadata.theme);
  supabase.auth.onAuthStateChange((_event, s)=>{
    session = s;
    if(session){
      if(session.user.user_metadata && session.user.user_metadata.theme) applyTheme(session.user.user_metadata.theme);
      loadAll();
    } else { dataLoaded = false; products=[]; ventas=[]; apartados=[]; gastos=[]; role=null; render(); }
  });
  if(session){ await loadAll(); } else { render(); }
}
const USUARIO_DOMINIO = 'evasdream.local';
function resolverEmail(valor){
  valor = valor.trim();
  return valor.includes('@') ? valor : `${valor.toLowerCase().replace(/\s+/g,'')}@${USUARIO_DOMINIO}`;
}
async function handleLogin(usuario, password){
  loginBusy = true; loginError = ''; render();
  const email = resolverEmail(usuario);
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  loginBusy = false;
  if(error){ loginError = 'Usuario o contraseña incorrectos.'; render(); }
}
async function handleLogout(){ await supabase.auth.signOut(); }

}
async function loadVentas(){

async function loadApartados(){

async function refreshAfterSale(){ await Promise.all([loadProducts(), loadVentas()]); }

async function uploadImage(file){
  const path = `productos/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.]/g,'_')}`;
  const { error } = await supabase.storage.from(BUCKET).upload(path, file, { upsert:false });
  if(error){ showToast('No se pudo subir la foto'); return null; }
  const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}
function exportCSV(){
  const headers = ['Nombre','Categoria','Subtipo','Variante','Cantidad','Precio venta','Precio compra','Ganancia unidad'];
  const rows = products.map(p=>[p.nombre, p.categoria, p.subtipo||'', p.variante||'', p.cantidad, p.precio||0, p.precio_compra||0, Number(p.precio||0)-Number(p.precio_compra||0)]);
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'inventario-evas-dream.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

/* ---------------- VENTAS (RPC) ---------------- */
function addToCart(p){
  const existing = cart.find(c=>c.id===p.id);
  const stock = Number(p.cantidad||0);
  if(existing){
    if(existing.cantidad < stock) existing.cantidad++;
  } else {
    if(stock <= 0) return;
    cart.push({ id:p.id, nombre:p.nombre, precio:Number(p.precio||0), stock, cantidad:1 });
  }
  render();
}
function changeCartQty(id, delta){
  const item = cart.find(c=>c.id===id);
  if(!item) return;
  item.cantidad = Math.max(1, Math.min(item.stock, item.cantidad + delta));
  render();
}
function removeFromCart(id){ cart = cart.filter(c=>c.id!==id); render(); }
function cartTotal(){ return cart.reduce((s,c)=>s+c.precio*c.cantidad,0); }

async function confirmSale(){
  if(cart.length===0) return;
  const items = cart.map(c=>({producto_id:c.id, cantidad:c.cantidad, precio_unitario:c.precio}));
  const { error } = await supabase.rpc('registrar_venta', { p_items: items, p_metodo_pago: metodoPago, p_notas: null });
  if(error){ showToast('No se pudo registrar la venta: ' + error.message); return; }
  cart = [];
  showToast('¡Venta registrada!');
  await refreshAfterSale();
  render();
}

/* ---------------- APARTADOS ---------------- */
function abonadoTotal(ap){ return (ap.apartado_abonos||[]).reduce((s,a)=>s+Number(a.monto||0),0); }

async function crearApartado(payload){
  const { error } = await supabase.from('apartados').insert(payload);
  if(error){ showToast('No se pudo crear el apartado'); return false; }
  showToast('Apartado creado'); await loadApartados(); return true;
}
async function agregarAbono(apartadoId, monto){
  const { error } = await supabase.from('apartado_abonos').insert({ apartado_id: apartadoId, monto });
  if(error){ showToast('No se pudo registrar el abono'); return false; }
  showToast('Abono registrado'); await loadApartados(); return true;
}
async function completarApartado(ap){
  const precioUnitario = Number(ap.precio_total||0) / Number(ap.cantidad||1);
  const { error } = await supabase.rpc('registrar_venta', {
    p_items: [{ producto_id: ap.producto_id, cantidad: ap.cantidad, precio_unitario: precioUnitario }],
    p_metodo_pago: 'apartado', p_notas: `Apartado de ${ap.cliente_nombre}`
  });
  if(error){ showToast('No se pudo completar: ' + error.message); return; }
  await supabase.from('apartados').update({ estado:'completado' }).eq('id', ap.id);
  showToast('Apartado completado y registrado como venta');
  await Promise.all([loadApartados(), refreshAfterSale()]);
  render();
}
async function cancelarApartado(id){
  await supabase.from('apartados').update({ estado:'cancelado' }).eq('id', id);
  showToast('Apartado cancelado'); await loadApartados(); render();
}

/* ---------------- DERIVED ---------------- */
function getFilteredInventario(){
  let list = products.filter(p=>{
    if(activeCat !== 'Todas' && p.categoria !== activeCat) return false;
    if(subtipoFilter !== 'Todos' && p.subtipo !== subtipoFilter) return false;
    if(onlyLowStock && Number(p.cantidad||0) > LOW_STOCK_THRESHOLD) return false;
    if(searchTerm){
      const hay = (p.nombre+' '+(p.subtipo||'')+' '+(p.variante||'')).toLowerCase();
      if(!hay.includes(searchTerm.toLowerCase())) return false;
    }
    return true;
  });
  const ganancia = p => Number(p.precio||0) - Number(p.precio_compra||0);
  if(sortBy === 'nombre') list.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  else if(sortBy === 'stock_asc') list.sort((a,b)=>Number(a.cantidad||0)-Number(b.cantidad||0));
  else if(sortBy === 'stock_desc') list.sort((a,b)=>Number(b.cantidad||0)-Number(a.cantidad||0));
  else if(sortBy === 'ganancia_desc') list.sort((a,b)=>ganancia(b)-ganancia(a));
  return list;
}
function getVentaProducts(){
  return products.filter(p=>{
    if(ventaCat !== 'Todas' && p.categoria !== ventaCat) return false;
    if(ventaSearch){
      const hay = (p.nombre+' '+(p.subtipo||'')).toLowerCase();
      if(!hay.includes(ventaSearch.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b)=>a.nombre.localeCompare(b.nombre));
}
function periodStart(period){
  const now = new Date();
  if(period==='hoy'){ const d=new Date(now); d.setHours(0,0,0,0); return d; }
  if(period==='semana'){ const d=new Date(now); d.setDate(d.getDate()-7); return d; }
  if(period==='mes'){ const d=new Date(now); d.setDate(d.getDate()-30); return d; }
  return new Date(0);
}
function ventasEnPeriodo(period){
  const start = periodStart(period);
  return ventas.filter(v=>new Date(v.created_at) >= start);
}
function gastosEnPeriodo(period){
  const start = periodStart(period);
  return gastos.filter(g=>new Date(g.created_at) >= start);
}

/* ---- GANANCIAS ---- */
function renderGanancias(){
  const periodos = [{id:'hoy',label:'Hoy'},{id:'semana',label:'7 días'},{id:'mes',label:'30 días'},{id:'todo',label:'Todo'}];
  const ventasP = ventasEnPeriodo(gananciasPeriodo);
  const gastosP = gastosEnPeriodo(gananciasPeriodo);
  const ingresos = ventasP.reduce((s,v)=>s+Number(v.total||0),0);
  const costoVendido = ventasP.reduce((s,v)=>s+(v.venta_items||[]).reduce((s2,i)=>s2+Number(i.costo_unitario||0)*Number(i.cantidad||0),0),0);
  const gananciaReal = ingresos - costoVendido;
  const totalGastos = gastosP.reduce((s,g)=>s+Number(g.monto||0),0);
  const gananciaNeta = gananciaReal - totalGastos;

  const inversionInv = products.reduce((s,p)=>s+Number(p.precio_compra||0)*Number(p.cantidad||0),0);
  const valorVentaInv = products.reduce((s,p)=>s+Number(p.precio||0)*Number(p.cantidad||0),0);
  const gananciaPotencial = valorVentaInv - inversionInv;

  const ventasCount = ventasP.length;
  const productMap = {};
  ventasP.forEach(v=>(v.venta_items||[]).forEach(i=>{
    if(!productMap[i.producto_id]) productMap[i.producto_id] = { nombre:i.nombre_producto, cantidad:0, ganancia:0 };
    productMap[i.producto_id].cantidad += Number(i.cantidad||0);
    productMap[i.producto_id].ganancia += (Number(i.precio_unitario||0)-Number(i.costo_unitario||0))*Number(i.cantidad||0);
  }));
  const topVendidos = Object.values(productMap).sort((a,b)=>b.ganancia-a.ganancia).slice(0,5);

  return `
    <div class="period-tabs">${periodos.map(p=>`<button class="period-tab ${gananciasPeriodo===p.id?'active':''}" data-periodo="${p.id}">${p.label}</button>`).join('')}</div>
    <section class="stats">
      <div class="stat"><div class="num">${ventasCount}</div><div class="lbl">Ventas registradas</div></div>
      <div class="stat"><div class="num">${money(ingresos)}</div><div class="lbl">Ingresos por ventas</div></div>
      <div class="stat bad"><div class="num">-${money(totalGastos)}</div><div class="lbl">Gastos del negocio</div></div>
      <div class="stat ${gananciaNeta>=0?'ok':'bad'}"><div class="num">${money(gananciaNeta)}</div><div class="lbl">Ganancia neta real</div></div>
    </section>

    <div class="panel" style="margin-bottom:16px;">
      <h3>Top 5 productos vendidos por ganancia</h3>
      <div class="panelsub">En el período seleccionado</div>
      <ul class="toplist">
        ${topVendidos.length ? topVendidos.map(p=>`<li><div><div class="tname">${esc(p.nombre)}</div><div class="tcat">${p.cantidad} unidades vendidas</div></div><div class="tval">${money(p.ganancia)}</div></li>`).join('') : '<li>Aún no hay ventas en este período.</li>'}
      </ul>
    </div>

    <div class="panel" style="margin-bottom:16px;">
      <h3>Ganancia potencial del inventario actual</h3>
      <div class="panelsub">Si vendieras todo el stock que tienes hoy (no incluye lo ya vendido)</div>
      <div class="stats" style="margin-bottom:0;">
        <div class="stat"><div class="num">${money(inversionInv)}</div><div class="lbl">Inversión en stock</div></div>
        <div class="stat"><div class="num">${money(valorVentaInv)}</div><div class="lbl">Valor de venta del stock</div></div>
        <div class="stat ok"><div class="num">${money(gananciaPotencial)}</div><div class="lbl">Ganancia potencial</div></div>
      </div>
    </div>

    <div class="panelgrid">
      <div class="panel">
        <h3>Unidades en stock por categoría</h3>
        <div class="panelsub">Distribución actual de inventario</div>
        <canvas id="chartDonut"></canvas>
      </div>
      <div class="panel">
        <h3>Ganancia potencial por categoría</h3>
        <div class="panelsub">(precio venta − precio compra) × stock actual</div>
        <canvas id="chartBar"></canvas>
      </div>
    </div>
  `;
}

function renderCharts(){
  if(!window.Chart) return;
  const canvasDonut = document.getElementById('chartDonut');
  const canvasBar = document.getElementById('chartBar');
  if(!canvasDonut || !canvasBar) return;
  const styles = getComputedStyle(document.documentElement);
  const colorFor = c => styles.getPropertyValue(catMeta(c).color).trim();
  const inkColor = styles.getPropertyValue('--ink').trim();
  const unidadesPorCat = CATS.map(c=>products.filter(p=>p.categoria===c.id).reduce((s,p)=>s+Number(p.cantidad||0),0));
  const gananciaPorCat = CATS.map(c=>products.filter(p=>p.categoria===c.id).reduce((s,p)=>s+(Number(p.precio||0)-Number(p.precio_compra||0))*Number(p.cantidad||0),0));
  if(chartDonut) chartDonut.destroy();
  if(chartBar) chartBar.destroy();
  chartDonut = new Chart(canvasDonut, { type:'doughnut', data:{ labels:CATS.map(c=>c.id), datasets:[{ data:unidadesPorCat, backgroundColor:CATS.map(c=>colorFor(c.id)), borderWidth:0 }] }, options:{ plugins:{ legend:{ position:'bottom', labels:{ color:inkColor, font:{family:'Poppins', size:11} } } } } });
  chartBar = new Chart(canvasBar, { type:'bar', data:{ labels:CATS.map(c=>c.id), datasets:[{ data:gananciaPorCat, backgroundColor:CATS.map(c=>colorFor(c.id)), borderRadius:8 }] }, options:{ plugins:{ legend:{ display:false } }, scales:{ x:{ ticks:{ color:inkColor, font:{family:'Poppins', size:10.5} }, grid:{ display:false } }, y:{ ticks:{ color:inkColor, font:{family:'JetBrains Mono', size:10} }, grid:{ color:'rgba(128,128,128,0.15)' } } } } });
}

      showToast('Cambios guardados');
    }
    editingId = null; div.remove(); await loadProducts(); render();
  });

  const search = document.getElementById('search'); if(search) search.addEventListener('input', (e)=>{ searchTerm = e.target.value; render(); });
  const selSubtipo = document.getElementById('selSubtipo'); if(selSubtipo) selSubtipo.addEventListener('change', (e)=>{ subtipoFilter = e.target.value; render(); });
  const selSort = document.getElementById('selSort'); if(selSort) selSort.addEventListener('change', (e)=>{ sortBy = e.target.value; render(); });
  document.querySelectorAll('[data-step]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id, delta = parseInt(btn.dataset.step, 10);
      const p = products.find(x=>x.id===id); if(!p) return;
      const nuevaCantidad = Math.max(0, Number(p.cantidad||0) + delta);
      const { error } = await supabase.from('products').update({ cantidad: nuevaCantidad }).eq('id', id);
      if(error){ showToast('No se pudo actualizar el stock'); return; }
      await loadProducts(); render();
    });
  });
  document.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click', ()=>{ editingId = btn.dataset.edit; renderProductModal(); }));
  document.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', ()=>{ confirmingDeleteId = btn.dataset.del; render(); }));
  document.querySelectorAll('[data-cancel-del]').forEach(btn=>btn.addEventListener('click', ()=>{ confirmingDeleteId = null; render(); }));
  document.querySelectorAll('[data-confirm-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.confirmDel;
      const { error } = await supabase.from('products').delete().eq('id', id);
      confirmingDeleteId = null;
      if(error){ showToast('No se pudo eliminar'); render(); return; }
      showToast('Producto eliminado'); await loadProducts(); render();
    });
  });

  // apartados
  const btnNuevoApartado = document.getElementById('btnNuevoApartado'); if(btnNuevoApartado) btnNuevoApartado.addEventListener('click', ()=>{ apModal = {type:'nuevo'}; render(); });
  document.querySelectorAll('[data-abono]').forEach(btn=>btn.addEventListener('click', ()=>{ apModal = {type:'abono', id:btn.dataset.abono}; render(); }));
  document.querySelectorAll('[data-cancelar-ap]').forEach(btn=>btn.addEventListener('click', ()=>cancelarApartado(btn.dataset.cancelarAp)));
  document.querySelectorAll('[data-completar-ap]').forEach(btn=>btn.addEventListener('click', ()=>{ const ap = apartados.find(a=>a.id===btn.dataset.completarAp); if(ap) completarApartado(ap); }));

  // gastos
  const btnNuevoGasto = document.getElementById('btnNuevoGasto'); if(btnNuevoGasto) btnNuevoGasto.addEventListener('click', ()=>{ gastoModal = true; render(); });
  document.querySelectorAll('[data-del-gasto]').forEach(btn=>btn.addEventListener('click', ()=>eliminarGasto(btn.dataset.delGasto)));

  // ganancias
  document.querySelectorAll('[data-periodo]').forEach(btn=>btn.addEventListener('click', ()=>{ gananciasPeriodo = btn.dataset.periodo; render(); }));
}

initAuth();
</script>
</body>
</html>
